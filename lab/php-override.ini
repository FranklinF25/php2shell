; php2shell lab overrides — sizes mirror the Datadog reproduction profile:
; small memory_limit so the OOM trigger is fast, roomy post_max_size so the
; trigger body is accepted. Defaults that matter for the vulnerable paths
; (session.upload_progress.enabled=On, .cleanup=On) stay at their factory
; values — they are part of what makes a stock deployment vulnerable.
memory_limit = 16M
post_max_size = 64M
display_errors = On
error_reporting = E_ALL
log_errors = On
error_log = /dev/stderr
session.save_path = /tmp
